[build]
  publish = "."
  command = ""

# sw.js dan manifest.json TIDAK BOLEH di-cache lama oleh CDN Netlify -- mekanisme
# "Ada pembaruan aplikasi" (lihat AVS.daftarSW di shell.js) bekerja dengan cara
# peramban mengecek ulang sw.js secara berkala; kalau Netlify menyimpannya lama,
# pengguna bisa terjebak di versi lama meski sudah di-deploy ulang.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache"

# Berkas catatan internal tidak untuk publik (isi rencana/petunjuk pemasangan).
[[redirects]]
  from = "/RENCANA-PENGEMBANGAN.md"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/PETUNJUK-PASANG.txt"
  to = "/index.html"
  status = 404
  force = true
